<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Housebox</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="../script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/ulol.png" alt="Housebox Logo">
                    <span>HOUSE<span>BOX</span></span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="find-storage.html">Find Storage</a></li>
                <li><a href="become-a-host.html">Become a Host</a></li>
                <li><a href="how-it-works.html">How It Works</a></li>
                <li><a href="about-us.html">About Us</a></li>
            </ul>
            <div class="nav-right">
                <a href="#" class="lang"><i class="fas fa-globe"></i> Philippines - English</a>
                <a href="login.html" class="login">Log in</a>
                <a href="signup.html" class="signup">Sign Up</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="form-section fade-in-section">
            <h1>Log In</h1>
            <p>Welcome back! Access your account.</p>
            <form class="auth-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="submit-btn">Log In</button>
            </form>
            <p class="form-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 HOUSEBOX. All rights reserved.</p>
            <ul class="footer-links">
                <li><a href="#">Privacy Policy</a></li>
                <li><a href="#">Terms of Service</a></li>
            </ul>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>

</body>
</html>
