<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Search Storage - Storage Rental</title>
</head>
<body>
    <h1>Search for Storage</h1>
    <input type="text" placeholder="Enter location">
    <br>
    <h2>Filters</h2>
    <label for="price">Price:</label>
    <input type="range" id="price" name="price" min="0" max="100">
    <br>
    <label for="size">Size:</label>
    <input type="text" id="size" name="size">
    <br>
    <h2>Results</h2>
    <div>
        <h3>Storage Space in [Location]</h3>
        <p>Size: 3 boxes</p>
        <p>Price: $50/month</p>
        <a href="booking.html"><button>View Details</button></a>
    </div>
</body>
</html>
